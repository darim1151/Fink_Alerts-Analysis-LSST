[metadata]
name = fink-lsst-analysis
version = 0.1.0
description = Local-first Fink LSST/Rubin alert-analysis reconnaissance tools.
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    requests>=2.31
    PyYAML>=6.0
    pandas>=2.0
    pyarrow>=15.0
    matplotlib>=3.7

[options.packages.find]
where = src
