[metadata]
name = fink-lsst-analysis
version = 0.1.0
description = Local-first Fink LSST/Rubin alert-analysis reconnaissance tools.
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    requests>=2.31
    PyYAML>=6.0
    pandas>=2.0
    pyarrow>=15.0
    matplotlib>=3.7

[options.packages.find]
where = src

[options.extras_require]
analytics =
    duckdb==1.4.4
    astropy>=6.0
    numpy>=1.24
characterization =
    astropy>=6.0
    numpy>=1.24
# Local/control-side portal automation only; never install into the Arnor science environment.
portal =
    playwright>=1.40

[options.entry_points]
console_scripts =
    fink-lsst = fink_lsst.acquisition.cli:main
